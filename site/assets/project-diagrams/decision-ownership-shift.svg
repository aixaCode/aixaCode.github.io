      src: url(data:font/woff2;base64,) format("woff2");
    }</style><filter id="decision-ownership-shift-desktop-rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.05" seed="108" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="4.5" xChannelSelector="R" yChannelSelector="G"/></filter><filter id="decision-ownership-shift-desktop-edge-rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.05" seed="108" result="noise"/><feDisplacementMap in="SourceGraphic" in2="noise" scale="1.575" xChannelSelector="R" yChannelSelector="G"/></filter></defs><title id="decision-ownership-shift-desktop-title">Sketch Flow diagram</title><desc id="decision-ownership-shift-desktop-description">Shared objectives, explicit decision boundaries and visible release evidence move normal decisions from a senior approval queue to the teams closest to the work.</desc><rect width="1350" height="520" fill="#ffffff"/><g class="sketch-flow-edges"><g data-edge="before:change" filter="url(#decision-ownership-shift-desktop-edge-rough)"><path d="M 400 260 C 428.6 260 423.4 260 452 260" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 432 268.4 L 452 260 L 432 251.6" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g data-edge="change:after" filter="url(#decision-ownership-shift-desktop-edge-rough)"><path d="M 855 260 C 883.6 260 878.4 260 907 260" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M 887 268.4 L 907 260 L 887 251.6" fill="none" stroke="#111111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g><g class="sketch-flow-nodes"><g data-node-id="before"><rect x="40" y="145" width="360" height="230" rx="9" fill="#ffffff" stroke="#dd4528" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#decision-ownership-shift-desktop-rough)"/><text x="220" y="228" fill="#dd4528" font-family="xkcd, &quot;Comic Sans MS&quot;, cursive" font-size="25" font-weight="600" text-anchor="middle"><tspan x="220" dy="0">BEFORE</tspan><tspan x="220" dy="27">Senior people decide</tspan><tspan x="220" dy="27">Work waits in approval</tspan><tspan x="220" dy="27">QA arrives late</tspan></text></g><g data-node-id="change"><rect x="465" y="155" width="390" height="210" rx="9" fill="#ffffff" stroke="#1464e8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#decision-ownership-shift-desktop-rough)"/><text x="660" y="241.5" fill="#1464e8" font-family="xkcd, &quot;Comic Sans MS&quot;, cursive" font-size="25" font-weight="600" text-anchor="middle"><tspan x="660" dy="0">SHARED OBJECTIVES</tspan><tspan x="660" dy="27">DECISION BOUNDARIES</tspan><tspan x="660" dy="27">VISIBLE RELEASE EVIDENCE</tspan></text></g><g data-node-id="after"><rect x="920" y="145" width="390" height="230" rx="9" fill="#ffffff" stroke="#4ab74e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" filter="url(#decision-ownership-shift-desktop-rough)"/><text x="1115" y="214.5" fill="#4ab74e" font-family="xkcd, &quot;Comic Sans MS&quot;, cursive" font-size="25" font-weight="600" text-anchor="middle"><tspan x="1115" dy="0">AFTER</tspan><tspan x="1115" dy="27">Teams own normal decisions</tspan><tspan x="1115" dy="27">Exceptions escalate</tspan><tspan x="1115" dy="27">QA joins while risk can</tspan><tspan x="1115" dy="27">change</tspan></text></g></g></svg>