<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1350 520" width="1350" height="520" role="img" aria-labelledby="decision-ownership-shift-desktop-title decision-ownership-shift-desktop-description"><defs><style id="decision-ownership-shift-desktop-font" type="text/css">@font-face {
